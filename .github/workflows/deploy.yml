name: GitHub Pages (redireciona para o Azure SWA)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# A produção migrou para o Azure Static Web Apps. O GitHub Pages agora apenas
# REDIRECIONA (preservando a rota em hash) — não builda mais o app.
# Reverter: restaurar o build (npm ci + npm run build + upload de ./dist).
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload redirect
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./redirect
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
